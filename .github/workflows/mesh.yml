name: mesh

# The Mesh Directory gate. A pull request that touches mesh/ is validated;
# a merge to main, and a weekly run, rewrite mesh/registry.json, which
# aipathway.com.au/explore-ai/mesh-directory and /mesh.json read. The weekly
# run is what marks a node stale when its conformance run passes 90 days.

on:
  pull_request:
    paths: ["mesh/**", ".github/workflows/mesh.yml"]
  push:
    branches: [main]
    paths: ["mesh/**", "skills/**", "tools/grok-bot/instructions.mjs", "tools/bot-skills/**", ".github/workflows/mesh.yml"]
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

# Merges land minutes apart, and each run commits the registry. One run at a
# time, never cancelled, so no rebuild is lost and none races another's push.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('mesh-pr-{0}', github.ref) || 'mesh-registry' }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The gate's own tests
        run: node --test mesh/validate.test.mjs
      - name: Validate every node
        run: node mesh/validate.mjs --write
      # The Bot Team as a ChatGPT/Codex plugin, one skill per listed bot, from
      # the registry just written. Regenerated with it so the two never drift.
      - name: Build the Bot Team skills
        run: node tools/bot-skills/build.mjs .
      - name: Commit the registry
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$(git status --porcelain -- mesh/registry.json plugins/bot-team)" ]; then exit 0; fi
          git config user.name "aipathway-mesh"
          git config user.email "hello@aipathway.com.au"
          git add mesh/registry.json plugins/bot-team
          git commit -m "mesh: regenerate the registry and Bot Team skills"
          # main may have moved while this ran. Rebase onto it and rebuild, so
          # the registry pushed is always the one for the newest main.
          for i in 1 2 3; do
            git push && exit 0
            git fetch -q origin main && git reset -q --hard origin/main
            node mesh/validate.mjs --write
            node tools/bot-skills/build.mjs .
            if [ -z "$(git status --porcelain -- mesh/registry.json plugins/bot-team)" ]; then exit 0; fi
            git add mesh/registry.json plugins/bot-team && git commit -q -m "mesh: regenerate the registry and Bot Team skills"
          done
          exit 1
      # The site caches the registry for 24 hours. Clear it so new bots and
      # links show on the next visit. Runs even when nothing changed, so a
      # manual run of this workflow is also the way to refresh the site.
      - name: Refresh the site's copy
        if: github.event_name != 'pull_request'
        env:
          SECRET: ${{ secrets.MESH_REVALIDATE_SECRET }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $SECRET" https://aipathway.com.au/api/mesh-revalidate
