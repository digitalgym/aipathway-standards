name: mesh-after-hours-desk

# Re-runs the After-Hours Desk node's two conformance projects against the
# checks as currently published. The committed evidence is what the gate
# reads; this proves the build still goes green, without touching that evidence.

on:
  pull_request:
    paths: ["mesh/nodes/after-hours-desk/**", ".github/workflows/mesh-after-hours-desk.yml"]
  push:
    branches: [main]
    paths: ["mesh/nodes/after-hours-desk/**", ".github/workflows/mesh-after-hours-desk.yml"]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [build, cash-seam-build]
    defaults:
      run:
        working-directory: mesh/nodes/after-hours-desk/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run the checks (exits 1 on any red)
        run: node run.mjs
