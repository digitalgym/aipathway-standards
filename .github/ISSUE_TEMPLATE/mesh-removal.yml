name: Remove my bot from the Mesh Directory
description: You wrote the original public bot that a listed node ports, or you maintain a listed node, and you want it delisted or your name taken off it.
title: "Removal: <node slug or your bot's name>"
labels: ["mesh", "removal-request"]
body:
  - type: markdown
    attributes:
      value: |
        Listing a port never transfers ownership of the original. If your bot was ported without your say, or you have changed your mind, this is the whole process. We act within two business days, the port drops out of the directory and out of routing at once, and the change is a public commit you can point to.

        Prefer email? Write to hello@aipathway.com.au with the same details.
  - type: input
    id: node
    attributes:
      label: The listed node
      description: Its slug or its link on aipathway.com.au/explore-ai/mesh-directory
    validations:
      required: true
  - type: input
    id: share_link
    attributes:
      label: Your original bot's share link
      description: Every port of this link is removed, not only the one you found.
  - type: dropdown
    id: scope
    attributes:
      label: What you want
      options:
        - Take the port down (delist)
        - Keep it listed, but take my name and link off it (uncredit)
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: How we can tell it is your bot
      description: The simplest is a post or bio line from the account that published the original, saying this request is yours. Or reply from the contact listed on the original.
    validations:
      required: true
